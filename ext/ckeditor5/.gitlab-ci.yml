stages: [build, package, release]

variables:
  EXTENSION_KEY: "ckeditor5"
  PACKAGE_NAME: "ckeditor5"
  ZIP_NAME: "ckeditor5-${CI_COMMIT_TAG}.zip"

build_release:
  stage: build
  image: alpine:3.22
  before_script:
    - apk add --no-cache git zip
  script:
    - mkdir -p "build/${EXTENSION_KEY}"
    - git archive --format=tar HEAD | tar -xf - -C "build/${EXTENSION_KEY}"
    - (cd build && zip -qr "../${ZIP_NAME}" "${EXTENSION_KEY}")
    - sha256sum "${ZIP_NAME}" > SHA256SUMS
    - test "$(unzip -Z1 "${ZIP_NAME}" | head -n1)" = "${EXTENSION_KEY}/"
  artifacts:
    paths:
      - "${ZIP_NAME}"
      - SHA256SUMS
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG

publish_release_package:
  stage: package
  image: curlimages/curl:8.12.1
  before_script: []
  needs:
    - job: build_release
      artifacts: true
  script:
    - 'export PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}"'
    - 'curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "${ZIP_NAME}" "${PACKAGE_URL}/${ZIP_NAME}"'
    - 'curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file SHA256SUMS "${PACKAGE_URL}/SHA256SUMS"'
  rules:
    - if: $CI_COMMIT_TAG

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  needs: [publish_release_package]
  script:
    - 'echo "Creating release ${CI_COMMIT_TAG}"'
  release:
    tag_name: '${CI_COMMIT_TAG}'
    description: 'See CHANGELOG.md for release details.'
    assets:
      links:
        - name: 'Installable ZIP'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}/${ZIP_NAME}'
          filepath: '/extension.zip'
          link_type: 'package'
        - name: 'SHA256 checksum'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}/SHA256SUMS'
          filepath: '/SHA256SUMS'
          link_type: 'package'
  rules:
    - if: $CI_COMMIT_TAG
