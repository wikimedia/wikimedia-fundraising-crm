<div id="cse-tabs-container">
  <div class="form-inline">
    <button type="button" class="btn btn-xs" ng-click="$ctrl.toggleTabs()">
      <i role="img" aria-hidden="true" class="crm-i fa-toggle-{{ $ctrl.layout.tabs ? 'on' : 'off' }}"></i>
      {{:: ts('Customize Tabs') }}
    </button>
    <label ng-if="$ctrl.layout.tabs">{{:: ts('Overriding defaults') }}</label>
    <label ng-if="!$ctrl.layout.tabs">{{:: $ctrl.isSystem ? ts('System defaults') : ts('Using defaults') }}</label>
  </div>
  <!--  Editable tabs -->
  <ul class="nav nav-tabs crm-tab-list cse-tabs-editable" role="tablist" ng-if="$ctrl.layout.tabs" ui-sortable="$ctrl.sortableOptions" ng-model="$ctrl.layout.tabs">
    <li role="presentation" class="crm-tab-button cse-tab crm-draggable" data-tab-id="{{ tab.id }}" ng-if="$ctrl.tabIsValid(tab)" ng-class="{'cse-tab-disabled': !tab.is_active}" ng-repeat="tab in $ctrl.layout.tabs">
      <a href role="tab">
        <span class="cse-tab-icon" ng-class="{'crm-editable-enabled': tab.is_active}" ng-click="tab.is_active && $ctrl.pickTabIcon(tab)">
          <i class="{{ tab.icon || 'crm-i fa-puzzle-piece' }}" role="img" aria-hidden="true"></i>
        </span>
        <span class="cse-tab-title" ng-if="tab.is_active" contact-layout-editable ng-model="tab.title">{{ tab.title }}</span>
        <span class="cse-tab-title" ng-if="!tab.is_active">{{ tab.title }}</span>
        <button type="button" class="cse-tab-toggle" ng-if="tab.id !== 'summary'" ng-click="$ctrl.toggleTabActive(tab)" title="{{ tab.is_active ? ts('Hide this tab') : ts('Restore this tab') }}">
          <i role="img" aria-hidden="true" class="crm-i" ng-class="{'fa-close': tab.is_active, 'fa-undo': !tab.is_active}"></i>
        </button>
      </a>
    </li>
  </ul>
  <!-- Default tabs -->
  <ul class="nav nav-tabs crm-tab-list" role="tablist" ng-if="!$ctrl.layout.tabs">
    <li role="presentation" class="crm-tab-button cse-tab" ng-repeat="tab in $ctrl.defaultTabs" ng-if="$ctrl.tabIsValid(tab)">
      <a href role="tab">
        <span class="cse-tab-icon">
          <i class="{{ tab.icon || 'crm-i fa-puzzle-piece' }}" role="img" aria-hidden="true"></i>
        </span>
        <span class="cse-tab-title">{{:: tab.title }}</span>
      </a>
    </li>
  </ul>
</div>
