# Templates are shared; see https://lab.civicrm.org/infra/extension-ci
include:
  - project: 'infra/extension-ci'
    ref: main
    file:
      - '/lint.yml'
      - '/phpunit.yml'

variables:
  # The tests install search_kit, which a bare install leaves disabled.
  CORE_EXTENSIONS: "org.civicrm.search_kit"

# Oldest supported stack. Must pass.
phpunit:min:
  extends: .phpunit-min

# Early warning of core drift. Never blocks a merge request.
phpunit:max:
  extends: .phpunit-max
  allow_failure: true
